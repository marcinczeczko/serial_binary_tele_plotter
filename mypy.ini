[mypy]
python_version = 3.14
strict = True
warn_unused_configs = True

[mypy-PyQt6.*]
ignore_missing_imports = True

[mypy-pyqtgraph.*]
ignore_missing_imports = True

[mypy-serial.*]
ignore_missing_imports = True

# Legacy tests are untyped (they monkeypatch a hand-written PyQt stub). New tests should
# be fully annotated; their bodies are still checked because annotated functions are.
[mypy-tests.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_calls = False
check_untyped_defs = False

# The PyQt6/pyqtgraph stub builds modules dynamically via ModuleType attribute assignment.
[mypy-tests.conftest]
disable_error_code = attr-defined
